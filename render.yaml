services:
  - type: web
    name: repomind-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Set to your Render app URL (e.g., https://repomind-ai.onrender.com)
      - key: BACKEND_URL
        sync: false # Set to your Render app URL (e.g., https://repomind-ai.onrender.com)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-latest
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_DIMENSION
        value: 384
