services:
  - type: web
    name: repomind-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Set to your Render app URL (e.g., https://repomind-ai.onrender.com)
      - key: BACKEND_URL
        sync: false # Set to your Render app URL (e.g., https://repomind-ai.onrender.com)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: GEMINI_CHAT_MODEL
        value: gemini-1.5-flash
      # EMBEDDING_PROVIDER selects how code chunks are embedded during indexing:
      #   "fastembed" — runs the model locally in-container (no API, but uses
      #                 ~200MB+ RAM; can OOM-kill the backend on the free tier).
      #   "gemini"    — offloads embeddings to the Google API (near-zero local
      #                 RAM). Set this if indexing keeps failing with 502s on the
      #                 free tier. Requires GOOGLE_API_KEY to be set, and you must
      #                 RE-INDEX each repository after switching (different model =
      #                 different vector space). Keep EMBEDDING_DIMENSION at 384.
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_DIMENSION
        value: 384 # must match for both providers so the pgvector column is stable
